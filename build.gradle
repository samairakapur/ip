plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Level-10: JavaFX, for the GUI (Main/Launcher/MainWindow/DialogBox).
    // Declared directly (rather than via the org.openjfx Gradle plugin)
    // with all three desktop platform classifiers, per the JavaFX setup
    // guide linked from the course's project page
    // (se-education.org/guides/tutorials/javaFxPart1.html) - this way the
    // build works unmodified regardless of which OS it's built on.
    String javaFxVersion = '17.0.7'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"
}

test {
    useJUnitPlatform()
}

application {
    // Level-10 switches the default entry point to the GUI (Launcher,
    // which starts Main - see its Javadoc for why it's a separate
    // class). The original console chat loop still works and is still
    // reachable directly as leo.Leo (Leo.main), it's just no longer
    // what `gradle run` or the packaged jar (see the `jar` task below)
    // launches by default.
    mainClass = 'leo.Launcher'
}

// The console chat loop (leo.Leo) reads commands from standard input;
// Gradle's `run` task does not forward the console's stdin by default,
// so this was needed to make that mode work interactively. Harmless to
// leave set now that `run` launches the GUI (leo.Launcher) by default,
// since the GUI doesn't read stdin at all. To run the console version
// instead, use `java -cp build/classes/java/main leo.Leo` after
// `gradle compileJava` (temporarily changing `mainClass` above back to
// 'leo.Leo' works too, for `gradle run`).
run {
    standardInput = System.in
}

// A-Jar: make `gradle jar` produce a directly-runnable jar
// (`java -jar build/libs/ip.jar`).
//
// Level-10 update: this project now has a real runtime dependency
// (JavaFX), so a plain jar with just a Main-Class manifest entry - as
// A-Jar originally set up - is no longer enough; JavaFX's classes need
// to be on the classpath too, or the jar will fail with
// NoClassDefFoundError as soon as it tries to open a window. Switching
// to a "fat jar" plugin (e.g. Shadow's shadowJar task, as suggested by
// the course's Gradle tutorial) to bundle those dependency classes in
// is the next step here, once this branch is confirmed working - not
// done yet, since it needs its own testing and is beyond what this
// increment asked for.
jar {
    manifest {
        attributes 'Main-Class': 'leo.Launcher'
    }
}

// No explicit toolchain/sourceCompatibility is pinned here: Gradle uses
// whichever JDK invokes it, matching the "use JDK 25" setup already
// described in AGENTS.md/README for this project. Add a
// `java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }`
// block later if you want Gradle to strictly enforce that version.
