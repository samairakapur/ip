plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

// A-CheckStyle: run static analysis against the SE-EDU Java coding
// standard (https://se-education.org/guides/conventions/java/) using
// the checker config in config/checkstyle/checkstyle.xml. `gradle check`
// (which `gradle build` already runs) will now also run
// checkstyleMain/checkstyleTest; run `gradle checkstyleMain` on its own
// to check only the main sources.
checkstyle {
    toolVersion = '10.12.4'
}

application {
    // Entry point of the application, per A-Packages' leo package.
    mainClass = 'leo.Leo'
}

// Leo reads commands from standard input; Gradle's `run` task does not
// forward the console's stdin by default, so it must be wired up
// explicitly for the app to work interactively via `gradle run`.
run {
    standardInput = System.in
}

// A-Jar: make `gradle jar` produce a directly-runnable jar
// (`java -jar build/libs/ip.jar`). This project currently has no
// third-party runtime dependencies (only a test-scoped JUnit), so a
// plain jar with a Main-Class manifest entry is sufficient - no need
// for a "fat jar" plugin like Shadow to bundle dependency classes. If
// a runtime dependency is added later (e.g. JavaFX), switch to the
// Shadow plugin's shadowJar task instead, per the course's Gradle
// tutorial.
jar {
    manifest {
        attributes 'Main-Class': 'leo.Leo'
    }
}

// No explicit toolchain/sourceCompatibility is pinned here: Gradle uses
// whichever JDK invokes it, matching the "use JDK 25" setup already
// described in AGENTS.md/README for this project. Add a
// `java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }`
// block later if you want Gradle to strictly enforce that version.
